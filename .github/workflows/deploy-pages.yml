name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages has no Node runtime, so the live /api/consultation route
      # can't run there. It's removed before this build so `next build`
      # produces a pure static export instead of failing on a POST handler
      # that static export can't serve. The full app (API route included)
      # still builds normally anywhere else — see next.config.ts.
      - run: rm -rf src/app/api

      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_PREVIEW: "true"
          NEXT_PUBLIC_SITE_URL: "https://${{ github.repository_owner }}.github.io/signalorbit"

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
